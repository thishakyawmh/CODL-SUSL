name: CODL Audit Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: ["audit/**"]

permissions:
  contents: write

jobs:
  backend-static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, xml, bcmath
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Check PHP syntax
        run: find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Commit synchronized frontend lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/package-lock.json
            git commit -m 'chore: synchronize frontend package lockfile [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Build frontend
        run: npm run build
